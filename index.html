<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>漢字の木 〜空の上へ〜 v0.9</title>
<link rel="stylesheet" href="./style-v08.css?v=0901">
<meta name="theme-color" content="#e9f7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="漢字の木">
</head>
<body>
<div id="app" class="app">
  <section id="mapScreen" class="screen mapScreen active">
    <div class="mapTop">
      <div>
        <div class="eyebrow">MIORI KANJI QUEST v0.9</div>
        <h1>漢字の木 <span>〜空の上へ〜</span></h1>
        <p>漢字を覚えるたびに、木が空へ空へとのびていくよ。</p>
      </div>
      <div class="mapStats"><b id="mapLevel">LEVEL 1</b><span id="mapCount">0 / 10</span></div>
    </div>

    <div class="skyWorld" aria-label="漢字の木の成長マップ">
      <div class="moon">🌙</div>
      <div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="cloud c3">☁️</div>
      <div class="stars">✨　⭐　✨</div>
      <div class="mountains">⛰️　🏔️　⛰️</div>
      <div class="city">🏠　🏫　🏢　🏠</div>
      <div class="treeBase"></div>
      <div id="treeTrunk" class="treeTrunk"></div>
      <div id="treeCrown" class="treeCrown">🌳</div>
      <div id="stageMarkers" class="stageMarkers"></div>
      <div class="ground">🌱🌿🌼🌱🌿🌼🌱🌿</div>
    </div>

    <div class="mapBottom">
      <div id="nextMission" class="nextMission"></div>
      <button id="startBtn" class="bigBtn">冒険をはじめる！ 🚀</button>
      <button id="resetProgressBtn" class="textBtn">進みぐあいをリセット</button>
    </div>
  </section>

  <section id="challengeScreen" class="screen challengeScreen">
    <header class="challengeTop">
      <button id="backMapBtn" class="iconBtn">← 木を見る</button>
      <div class="miniProgress"><div id="miniProgressFill"></div></div>
      <div id="stageLabel" class="stageLabel">STAGE 1</div>
    </header>

    <div class="challengeLayout">
      <main class="writingArea">
        <div class="wordGuide">
          <div class="wordSlots" id="wordSlots"></div>
          <div id="charPrompt" class="charPrompt"></div>
        </div>

        <div class="canvasShell">
          <canvas id="writeCanvas" width="760" height="760"></canvas>
          <div id="ghostChar" class="ghostChar"></div>
          <div class="cross v"></div><div class="cross h"></div>
        </div>

        <div id="statusLine" class="statusLine">思い出せたら、書いてみよう ✏️</div>
        <div class="mainActions">
          <button id="undoBtn" class="toolBtn">↩ 1画もどす</button>
          <button id="clearBtn" class="toolBtn">消す</button>
          <button id="checkBtn" class="checkBtn">できた！判定</button>
        </div>

        <div class="helpZone">
          <div class="helpHead"><b>止まったら HELP！</b><span>答えを一気に見せず、少しずつヒント</span></div>
          <div id="helpSteps" class="helpSteps"></div>
          <button id="helpBtn" class="helpBtn">💡 ヒントを1つもらう</button>
          <div id="helpCard" class="helpCard"></div>
        </div>
      </main>

      <aside class="questionPaper">
        <div class="paperTag">きょうの もんだい</div>
        <div id="verticalQuestion" class="verticalQuestion"></div>
        <div id="questionIcon" class="questionIcon">🚌</div>
      </aside>
    </div>
  </section>

  <section id="strokeScreen" class="screen strokeScreen">
    <header class="challengeTop"><button id="closeStrokeBtn" class="iconBtn">← もどる</button><div class="strokeTitle">書き順ヘルプ</div></header>
    <div class="strokeBody">
      <div id="strokeCharLabel" class="strokeCharLabel"></div>
      <div class="strokeStage"><svg id="strokeSvg" viewBox="0 0 109 109"></svg><div id="pencil" class="pencil">✏️</div></div>
      <div id="strokeMsg" class="strokeMsg">書き順を準備中…</div>
      <div class="strokeActions"><button id="replayStrokeBtn" class="toolBtn">▶ もう一回</button><button id="returnWriteBtn" class="checkBtn">自分で書く！</button></div>
    </div>
  </section>

  <section id="secretScreen" class="screen secretScreen">
    <div class="secretWrap">
      <div class="eyebrow">KANJI SECRET</div>
      <h2>漢字のヒミツをゲット！</h2>
      <div id="secretCards" class="secretCards"></div>
      <div class="rewardBox"><div id="rewardStars" class="rewardStars"></div><div id="rewardText"></div></div>
      <button id="growTreeBtn" class="bigBtn">木をのばす！ 🌳</button>
    </div>
  </section>

  <section id="growScreen" class="screen growScreen">
    <div class="growSky"><div class="growCloud">☁️</div><div id="growTree" class="growTree">🌳</div><div id="growMessage" class="growMessage">ぐんぐん のびる！</div></div>
  </section>

  <section id="finishScreen" class="screen finishScreen">
    <div class="finishCard"><div class="finishEmoji">🌳☁️✨</div><h2>雲の上まで とどいた！</h2><p>10この漢字クエスト、クリア！</p><div id="finishStars" class="finishStars"></div><button id="finishMapBtn" class="bigBtn">育った木を見る</button></div>
  </section>
</div>

<script src="./data-v08.js?v=0901"></script>
<script src="./app-v08.js?v=0901"></script>
<script src="./judge-v09.js?v=0901"></script>
</body>
</html>
