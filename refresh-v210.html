<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miori Kanji Quest refresh</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#eef8ff;color:#29445c;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:28px;border-radius:22px;box-shadow:0 12px 35px #7da8c533;text-align:center;max-width:520px;margin:20px}h1{font-size:24px;margin:0 0 10px}p{line-height:1.7}.ok{font-weight:800;color:#247a52}
</style>
</head>
<body>
<div class="card"><h1>最新版に切り替え中…</h1><p>学習データは消さずに、古いWebキャッシュだけ整理しています。</p><p id="status">準備中…</p></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.textContent='キャッシュ整理OK。最新版を開きます！';
    status.className='ok';
  }catch(e){
    status.textContent='最新版を開きます…';
  }
  setTimeout(()=>location.replace('./?fresh=2101-'+Date.now()),700);
})();
</script>
</body>
</html>
