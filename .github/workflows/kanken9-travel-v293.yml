name: Release Moko flight and island landing v2.9.3
on:
  push:
    paths:
      - '.github/workflows/kanken9-travel-v293.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate-test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate only the journey and island visual layout
        run: python3 tools/kanken9-travel-v293-release.py
      - name: Check syntax
        run: |
          node --check kanken9-travel-v293.js
          node --check app-v240-release.js
          node --check kanken9-travel-v293.test.cjs
      - name: Run all established checks and new flight smoke test
        run: |
          node kanken9-smoke-test.cjs
          node kanken9-exam-smoke-test.cjs
          node kanken9-v284-smoke-test.cjs
          node kanken9-v285-smoke-test.cjs
          node kanken9-v287-smoke-test.cjs
          node kanken9-v288-smoke-test.cjs
          node kanken9-v290-layout-test.cjs
          node kanken9-travel-v293.test.cjs
      - name: Publish changes only if every test passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v240-release.js index.html README.md '*test.cjs'
          git diff --cached --quiet && exit 0
          git commit -m 'Release Moko airplane journey and island-first Kanken home (v2.9.3)'
          git push
# Restricted Pages workflow stays untouched; release CI runs all new and old checks.
