name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Kanji 9 expedition
        run: |
          node --check kanken9-data-v280.js
          node --check kanken9-island-v280.js
          node --check kanken9-ui-fix-v281.js
          node --check kanken9-viewport-v282.js
          node --check kanken9-exam-data-v283.js
          node --check kanken9-exam-screen-v283.js
          node --check kanken9-exam-v283.js
          node --check app-v240-release.js
          node kanken9-smoke-test.cjs
          node kanken9-exam-smoke-test.cjs

      - name Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Redeploy after transfer to nagaita-family
